<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#ffffff" />
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="coreBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="30%" stop-color="#6b21a8" />
      <stop offset="70%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#18032d" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="greenArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="redArrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <path id="bottomTextArc" d="M 90 300 A 130 130 0 0 0 310 300" fill="none" />
  </defs>

  <!-- ==========================================
       OUTER GEAR COGWHEEL (16 TEETH)
       ========================================== -->
  <g fill="#2e1065" stroke="#7c3aed" stroke-width="2">
    <circle cx="200" cy="200" r="175" fill="url(#gearGrad)" />
    <!-- 16 Teeth -->
    <rect x="182" y="5" width="36" height="36" rx="4" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(22.5 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(45 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(67.5 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(90 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(112.5 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(135 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(157.5 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(180 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(202.5 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(225 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(247.5 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(270 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(292.5 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(315 200 200)" />
    <rect x="182" y="5" width="36" height="36" rx="4" transform="rotate(337.5 200 200)" />
  </g>

  <!-- Inner Badge Circle -->
  <circle cx="200" cy="200" r="148" fill="url(#coreBg)" stroke="#c084fc" stroke-width="3" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- ==========================================
       INNER GRAPHICS & SHIELD
       ========================================== -->
  <!-- Shield Background -->
  <path d="M 200 110 C 240 110 275 125 275 160 C 275 220 200 275 200 275 C 200 275 125 220 125 160 C 125 125 160 110 200 110 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3" />

  <!-- Grid lines inside shield -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.35">
    <line x1="150" y1="140" x2="250" y2="140" />
    <line x1="140" y1="170" x2="260" y2="170" />
    <line x1="150" y1="200" x2="250" y2="200" />
    <line x1="170" y1="125" x2="170" y2="245" />
    <line x1="200" y1="120" x2="200" y2="260" />
    <line x1="230" y1="125" x2="230" y2="245" />
  </g>

  <!-- Lightning Bolt -->
  <polygon points="190,125 155,185 188,185 170,240 225,170 192,170" fill="url(#cyanGlow)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Loss Reduction Line & Arrows -->
  <g>
    <!-- Green Upward Trend -->
    <polyline points="200,210 215,195 235,175 255,150" fill="none" stroke="url(#greenArrow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="255" cy="150" r="3.5" fill="#34d399" />
    <!-- Red Downward Arrow -->
    <line x1="175" y1="205" x2="175" y2="235" stroke="url(#redArrow)" stroke-width="3" stroke-linecap="round" />
    <polyline points="167,225 175,235 183,225" fill="none" stroke="url(#redArrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==========================================
       TEXT ELEMENTS
       ========================================== -->
  <!-- Top Main Title "FLADIX" -->
  <text x="200" y="90" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="36" fill="#38bdf8" text-anchor="middle" letter-spacing="3" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.6))">FLADIX</text>
  <text x="200" y="90" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="36" fill="none" stroke="#f472b6" stroke-width="0.7" text-anchor="middle" letter-spacing="3">FLADIX</text>

  <!-- Bottom Curved Text "ELECTRIC LOSS ANALYSIS" -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14.5" fill="#38bdf8" letter-spacing="2.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">ELECTRIC LOSS ANALYSIS</textPath>
  </text>
</svg>
